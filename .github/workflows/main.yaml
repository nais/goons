name: Build and deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "*.env"

permissions:
  contents: write
  id-token: write

jobs:
  build-deploy:
    uses: nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@224e80d9c606b8856febec973f8a64a24dd92ace # ratchet:nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@main
    with:
      builds-chart: true
      deploys-to-fasit: true
      mise-tasks: '["ci"]'
      targets: |
        [
          { "target": { "kind": "management", "tenant": "ci-nais" }, "wait": true },
          { "target": { "kind": "management" } }
        ]
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
